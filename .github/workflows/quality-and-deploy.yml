name: LeetTutor quality and demo deployment

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leettutor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py leettutor scripts tests
      - name: Run tests
        run: python -m pytest -q
      - name: Validate static demo JavaScript
        run: node --check web-demo/app.js
      - name: Package static demo
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          mkdir -p release/frontend
          cp -a web-demo/. release/frontend/
          printf '%s\n' "$GITHUB_SHA" > release/.deploy-commit
          tar -C release -czf leettutor-demo.tgz .
      - name: Upload static demo
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: leettutor-${{ github.sha }}
          path: leettutor-demo.tgz
          if-no-files-found: error
          retention-days: 7

  deploy-demo:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: [self-hosted, production, leetcode]
    environment:
      name: production
      url: https://tonytan.me/leetcode/
    steps:
      - name: Download static demo
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: leettutor-${{ github.sha }}
      - name: Deploy reviewed static release
        run: sudo /usr/local/sbin/deploy-tonytan-app leetcode < leettutor-demo.tgz
      - name: Verify public demo
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors https://tonytan.me/leetcode/ >/dev/null
